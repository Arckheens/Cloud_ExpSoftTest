<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Support ExpSoft</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232563eb%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2716%27 font-family=%27Arial%27 font-weight=%27bold%27 fill=%27white%27 text-anchor=%27middle%27%3EES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <h1>ExpSoft <span>Admin support</span></h1>
    <div class="actions" style="margin: 0" id="top-actions" hidden>
      <button type="button" id="export-btn" class="secondary">Sauvegarde</button>
      <button type="button" id="logout-btn" class="secondary">Déconnexion</button>
    </div>
  </header>

  <main class="wide">
    <!-- Connexion -->
    <form id="login-form" class="card" style="max-width: 420px; margin: 40px auto" hidden>
      <h2>Connexion</h2>
      <div id="login-hint"></div>
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <div id="login-feedback"></div>
      <div class="actions"><button type="submit">Se connecter</button></div>
    </form>

    <!-- Tableau de bord -->
    <div id="app" hidden>
      <div class="stats" id="stats"></div>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-tickets" aria-selected="true">Tickets</button>
        <button type="button" role="tab" id="tab-contacts" aria-selected="false">Messages de contact</button>
      </div>

      <section id="panel-tickets">
        <div class="toolbar">
          <input id="search" type="search" placeholder="Rechercher (n°, sujet, nom, e-mail, logiciel)">
          <select id="filter-status">
            <option value="ouverts">Tickets ouverts</option>
            <option value="">Tous les tickets</option>
          </select>
          <button type="button" id="refresh-btn" class="secondary">Actualiser</button>
        </div>
        <div class="split">
          <div class="list" id="ticket-list"></div>
          <div id="ticket-detail"><div class="card empty">Sélectionne un ticket.</div></div>
        </div>
      </section>

      <section id="panel-contacts" hidden>
        <div class="list" id="contact-list"></div>
      </section>
    </div>
  </main>

  <script src="assets/common.js"></script>
  <script src="assets/admin.js"></script>
</body>
</html>
